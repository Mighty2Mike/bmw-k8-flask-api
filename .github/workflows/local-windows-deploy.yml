name: Local Windows — Terraform + Helm Deploy (Minikube)

# =============================================================================
# PURPOSE
#   Installs Terraform on a Windows machine, runs terraform apply against
#   a local Minikube cluster, then deploys the Flask app via Helm.
#
# RUN WITH act ON WINDOWS:
#   Prerequisites (run once):
#     winget install nektos.act
#     winget install Docker.DockerDesktop
#     winget install Kubernetes.minikube
#     winget install Helm.Helm
#
#   Start Minikube before running:
#     minikube start --driver=docker
#
#   Run the workflow:
#     act push -W .github/workflows/local-windows-deploy.yml
#     act workflow_dispatch -W .github/workflows/local-windows-deploy.yml
#
#   Run a single job:
#     act push -j terraform-local  -W .github/workflows/local-windows-deploy.yml
#     act push -j helm-deploy      -W .github/workflows/local-windows-deploy.yml
#
# SECRETS FILE (.secrets in repo root — add to .gitignore):
#   DOCKERHUB_USERNAME=michaelnthodidocker
#   DOCKERHUB_TOKEN=<your-token>
#
# act RUNNER (add to %USERPROFILE%\.actrc):
#   -P ubuntu-latest=catthehacker/ubuntu:act-22.04
#   --secret-file .secrets
# =============================================================================

on:
  # push:
  #   branches: [main, develop]
  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Terraform action to run"
        required: true
        default: "apply"
        type: choice
        options: [plan, apply, destroy]
      helm_action:
        description: "Helm action to run"
        required: true
        default: "upgrade"
        type: choice
        options: [upgrade, rollback, uninstall]
      terraform_version:
        description: "Terraform version to install"
        required: false
        default: "1.8.0"

# Cancel any in-flight run on the same branch to avoid conflicting applies
concurrency:
  group: local-deploy-${{ github.ref }}
  cancel-in-progress: false   # Never cancel mid-apply — could leave state corrupt

env:
  TERRAFORM_VERSION:  ${{ github.event.inputs.terraform_version || '1.8.0' }}
  TERRAFORM_DIR:      ./terraform
  HELM_RELEASE:       bmw-k8-flask-api
  HELM_CHART_PATH:    ./charts/bmw-k8-flask-api
  HELM_NAMESPACE:     default
  DOCKER_IMAGE:       michaelnthodidocker/bmw-flask-k8-assessment
  DOCKER_TAG:         ${{ github.sha }}
  KUBECONFIG_PATH:    $HOME/.kube/config      # bind-mounted from Windows host
  MINIKUBE_CONTEXT:   minikube

permissions:
  contents: read

# =============================================================================
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — PREFLIGHT
  # Verify that the Windows host has everything needed before we touch state.
  # Failing here is cheap; failing mid-apply is expensive.
  # ───────────────────────────────────────────────────────────────────────────
  preflight:
    name: "✅ Preflight — verify host environment"
    runs-on: ubuntu-latest   # act runs Linux containers even on Windows host

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify Docker Service
        run: |
          docker info
          docker ps

      - name: Setup Kubernetes Cluster in Docker Environment
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker

      # ── Verify kubectl can reach Minikube ──────────────────────────────────
      - name: Check Minikube is reachable
        run: |
          echo "── kubectl version ─────────────────────────────────────────"
          kubectl version --client

          # echo ""
          # echo "── Active context ──────────────────────────────────────────"
          # kubectl config current-context

          # echo ""
          # echo "── Cluster info ────────────────────────────────────────────"
          # kubectl cluster-info --request-timeout=10s

          # echo ""
          # echo "── Node status ─────────────────────────────────────────────"
          # kubectl get nodes -o wide
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}

      # ── Verify Helm chart exists ───────────────────────────────────────────
      - name: Verify Helm chart exists
        run: |
          if [ ! -f "${{ env.HELM_CHART_PATH }}/Chart.yaml" ]; then
            echo "❌ Helm chart not found at ${{ env.HELM_CHART_PATH }}"
            echo "   Expected: ${{ env.HELM_CHART_PATH }}/Chart.yaml"
            ls -la ./helm/ 2>/dev/null || echo "   ./helm/ directory does not exist"
            exit 1
          fi
          echo "✅ Helm chart found: ${{ env.HELM_CHART_PATH }}"
          cat ${{ env.HELM_CHART_PATH }}/Chart.yaml

      # ── Verify Terraform directory exists ─────────────────────────────────
      - name: Verify Terraform directory exists
        run: |
          if [ ! -d "${{ env.TERRAFORM_DIR }}" ]; then
            echo "❌ Terraform directory not found at ${{ env.TERRAFORM_DIR }}"
            exit 1
          fi
          echo "✅ Terraform directory found"
          echo ""
          echo "── Terraform files ─────────────────────────────────────────"
          find ${{ env.TERRAFORM_DIR }} -name "*.tf" | head -20

      # ── Lint Helm chart early — catch errors before infra changes ──────────
      - name: Lint Helm chart
        run: |
          helm version
          echo ""
          helm lint ${{ env.HELM_CHART_PATH }} \
            --set image.repository=${{ env.DOCKER_IMAGE }} \
            --set image.tag=${{ env.DOCKER_TAG }} \
            --set image.pullPolicy=Never \
            --set service.type=NodePort \
            --strict
          echo "✅ Helm chart lint passed"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — TERRAFORM INSTALL & APPLY
  # Downloads the specified Terraform version from HashiCorp's releases,
  # installs it to /usr/local/bin inside the act container, then runs
  # init → validate → plan → apply against the local Minikube cluster.
  #
  # Backend: local  (no S3/remote state — keeps this fully self-contained)
  # Provider auth:  reads ~/.kube/config mounted from the Windows host
  # ───────────────────────────────────────────────────────────────────────────
  terraform-local:
    name: "🏗️  Terraform — install ${{ github.event.inputs.terraform_version || '1.8.0' }} + ${{ github.event.inputs.terraform_action || 'apply' }}"
    runs-on: ubuntu-latest
    needs: [preflight]

    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_DIR }}

    outputs:
      apply_outcome: ${{ steps.apply.outcome }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Install Terraform (manual binary install — no cloud auth needed) ───
      # We install manually so we control the exact version without relying
      # on HashiCorp's setup-terraform action (which may need TFCB tokens).
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      # - name: Install Terraform ${{ env.TERRAFORM_VERSION }}
      #   run: |
      #     set -euo pipefail

      #     TF_VERSION="${{ env.TERRAFORM_VERSION }}"
      #     TF_ARCH="linux_amd64"
      #     TF_ZIP="terraform_${TF_VERSION}_${TF_ARCH}.zip"
      #     TF_URL="https://releases.hashicorp.com/terraform/${TF_VERSION}/${TF_ZIP}"
      #     TF_SHA_URL="${TF_URL%zip}SHA256SUMS"

      #     echo "📥 Downloading Terraform ${TF_VERSION}..."
      #     echo "   URL: ${TF_URL}"

      #     # Download binary and SHA256 checksum file
      #     curl -fsSL "${TF_URL}"     -o /tmp/${TF_ZIP}
      #     curl -fsSL "${TF_SHA_URL}" -o /tmp/terraform_SHA256SUMS

      #     echo ""
      #     echo "🔐 Verifying SHA256 checksum..."
      #     cd /tmp
      #     grep "${TF_ZIP}" terraform_SHA256SUMS | sha256sum --check --status
      #     echo "✅ Checksum verified"

      #     echo ""
      #     echo "📦 Installing to /usr/local/bin/terraform..."
      #     unzip -q /tmp/${TF_ZIP} -d /tmp/terraform_extracted
      #     sudo install -m 755 /tmp/terraform_extracted/terraform /usr/local/bin/terraform

      #     # Cleanup
      #     rm -rf /tmp/${TF_ZIP} /tmp/terraform_SHA256SUMS /tmp/terraform_extracted

      #     echo ""
      #     echo "✅ Terraform installed:"
      #     terraform version

      # ── Write local backend override ───────────────────────────────────────
      # Inject a local backend so we never need S3/remote state.
      # The override file is written dynamically and ignored by git.
      - name: Write local backend configuration
        run: |
          # backend_override.tf takes precedence over any backend block in main.tf
          cat > backend_override.tf <<'EOF'
          # AUTO-GENERATED — do not commit (added to .gitignore)
          # Overrides any remote/S3 backend for local Minikube runs
          terraform {
            backend "local" {
              path = "local-state/terraform.tfstate"
            }
          }
          EOF

          mkdir -p local-state
          echo "✅ Local backend override written"
          cat backend_override.tf

      # ── Write local provider values override ───────────────────────────────
      # Override cloud-specific variables with Minikube-safe values.
      - name: Write local variable overrides
        run: |
          cat > local.auto.tfvars <<'EOF'
          # AUTO-GENERATED — do not commit
          # Overrides production values for local Minikube execution

          environment         = "local"
          docker_image        = "${{ env.DOCKER_IMAGE }}"
          docker_tag          = "${{ env.DOCKER_TAG }}"

          # Kubernetes provider — point at Minikube via kubeconfig
          kubeconfig_path     = "${{ env.KUBECONFIG_PATH }}"
          kubeconfig_context  = "${{ env.MINIKUBE_CONTEXT }}"

          # Minikube has no cloud load balancer — use NodePort
          service_type        = "NodePort"

          # Disable cloud-specific resources (set to false/empty for local)
          # Uncomment and adjust based on your terraform module structure:
          # create_s3_bucket    = false
          # create_rds          = false
          # create_acm_cert     = false
          # create_route53      = false
          EOF

          echo "✅ Local tfvars written"
          cat local.auto.tfvars

      # ── terraform init ─────────────────────────────────────────────────────
      - name: Terraform Init
        id: init
        run: |
          echo "── terraform init ──────────────────────────────────────────"
          terraform init \
            -reconfigure \
            -upgrade \
            -no-color
          echo "✅ Init complete"

      # ── terraform validate ─────────────────────────────────────────────────
      - name: Terraform Validate
        id: validate
        run: |
          echo "── terraform validate ──────────────────────────────────────"
          terraform validate -no-color
          echo "✅ Validate passed"

      # # ── terraform fmt check ────────────────────────────────────────────────
      # - name: Terraform Format Check
      #   id: fmt
      #   run: |
      #     echo "── terraform fmt ───────────────────────────────────────────"
      #     terraform fmt -check -recursive -no-color || {
      #       echo "⚠️  Formatting issues found — auto-fixing..."
      #       terraform fmt -recursive
      #       echo "   Run 'terraform fmt -recursive' locally and commit the changes."
      #     }

      # ── terraform plan ─────────────────────────────────────────────────────
      - name: Terraform Plan
        id: plan
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          echo "── terraform plan ──────────────────────────────────────────"
          terraform plan \
            -no-color \
            -out=tfplan \
            -detailed-exitcode \
            2>&1 | tee plan-output.txt

          PLAN_EXIT=${PIPESTATUS[0]}
          echo ""
          if   [ $PLAN_EXIT -eq 0 ]; then echo "✅ Plan: no changes"
          elif [ $PLAN_EXIT -eq 2 ]; then echo "📋 Plan: changes detected — will apply"
          else
            echo "❌ Plan failed with exit code $PLAN_EXIT"
            exit $PLAN_EXIT
          fi
        continue-on-error: false

      # ── terraform apply / plan-only / destroy ──────────────────────────────
      - name: "Terraform ${{ github.event.inputs.terraform_action || 'apply' }}"
        id: apply
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          ACTION="${{ github.event.inputs.terraform_action || 'apply' }}"
          echo "── terraform ${ACTION} ─────────────────────────────────────"

          case "${ACTION}" in

            apply)
              terraform apply \
                -auto-approve \
                -no-color \
                -input=false \
                tfplan
              echo ""
              echo "✅ Apply complete"

              # Show what was created / updated
              echo ""
              echo "── Resources in state ──────────────────────────────────"
              terraform state list 2>/dev/null || true

              echo ""
              echo "── Outputs ─────────────────────────────────────────────"
              terraform output -no-color 2>/dev/null || echo "(no outputs defined)"
              ;;

            plan)
              echo "ℹ️  Plan-only mode selected — no changes applied"
              echo "   Review the plan output above and re-run with action=apply"
              ;;

            destroy)
              echo "⚠️  DESTROY selected — this will remove ALL managed resources"
              echo "   Waiting 5 seconds — press Ctrl+C to abort..."
              sleep 5
              terraform destroy \
                -auto-approve \
                -no-color \
                -input=false
              echo "✅ Destroy complete"
              ;;

          esac

      # ── Save Terraform artifacts ───────────────────────────────────────────
      - name: Upload Terraform artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-local-${{ github.sha }}
          path: |
            ${{ env.TERRAFORM_DIR }}/plan-output.txt
            ${{ env.TERRAFORM_DIR }}/local-state/terraform.tfstate
          retention-days: 7
          # Keep state for 7 days for debugging — not a substitute for real remote state

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — HELM DEPLOY
  # Deploys the Flask app to Minikube using Helm upgrade --install.
  # Uses imagePullPolicy: Never so Kubernetes uses the image already loaded
  # into Minikube's cache (via `minikube image load` or `eval $(minikube docker-env)`).
  # Uses NodePort service since Minikube has no cloud LoadBalancer by default.
  # ───────────────────────────────────────────────────────────────────────────
  helm-deploy:
    name: "⛵ Helm — ${{ github.event.inputs.helm_action || 'upgrade' }} → Minikube"
    runs-on: ubuntu-latest
    needs: [terraform-local]
    # Only deploy if apply succeeded (or if plan-only, skip helm)
    if: |
      github.event.inputs.terraform_action != 'destroy' &&
      github.event.inputs.helm_action != 'uninstall'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Confirm target cluster is Minikube ─────────────────────────────────
      - name: Confirm Minikube context
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          CURRENT_CTX=$(kubectl config current-context)
          echo "Active context: ${CURRENT_CTX}"

          if [ "${CURRENT_CTX}" != "${{ env.MINIKUBE_CONTEXT }}" ]; then
            echo ""
            echo "⚠️  WARNING: current context is '${CURRENT_CTX}'"
            echo "   Expected:  '${{ env.MINIKUBE_CONTEXT }}'"
            echo "   Switching to minikube context..."
            kubectl config use-context ${{ env.MINIKUBE_CONTEXT }}
          fi

          echo ""
          echo "── Cluster nodes ───────────────────────────────────────────"
          kubectl get nodes
          echo ""
          echo "── Existing Helm releases ──────────────────────────────────"
          helm list --all-namespaces 2>/dev/null || true

      # ── Install helm-diff for change preview ──────────────────────────────
      - name: Install helm-diff plugin
        run: |
          helm plugin install https://github.com/databus23/helm-diff \
            2>/dev/null || echo "helm-diff already installed"
          helm plugin list

      # ── Preview what will change (non-fatal) ──────────────────────────────
      - name: Helm diff — preview changes
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          echo "── helm diff (what will change) ────────────────────────────"
          helm diff upgrade ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART_PATH }} \
            --namespace   ${{ env.HELM_NAMESPACE }} \
            --set image.repository=${{ env.DOCKER_IMAGE }} \
            --set image.tag=${{ env.DOCKER_TAG }} \
            --set image.pullPolicy=Never \
            --set service.type=NodePort \
            --set environment=local \
            --allow-unreleased \
            --no-color \
            2>&1 || true
          # --allow-unreleased: non-fatal if this is a first install (no existing release)

      # ── helm upgrade --install ─────────────────────────────────────────────
      - name: "helm upgrade --install ${{ env.HELM_RELEASE }}"
        id: helm-deploy
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          echo "── helm upgrade --install ──────────────────────────────────"
          helm upgrade --install ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART_PATH }} \
            --namespace   ${{ env.HELM_NAMESPACE }} \
            --create-namespace \
            --set image.repository=${{ env.DOCKER_IMAGE }} \
            --set image.tag=${{ env.DOCKER_TAG }} \
            --set image.pullPolicy=Never \
            --set service.type=NodePort \
            --set environment=local \
            --atomic \
            --timeout 3m \
            --wait \
            --history-max 5 \
            --no-hooks=false \
            --debug
          #
          # Flag explanations (senior DevOps talking points):
          #
          # --install      : creates the release if it doesn't exist, upgrades if it does
          # --atomic       : rolls back automatically if any resource fails to become Ready
          # --wait         : blocks until all Pods/PVCs/Services are Ready
          # --timeout 3m   : 3 min is generous for Minikube; tighten for prod (5m typical)
          # --history-max 5: caps stored revisions — prevents etcd bloat over many deploys
          # --create-namespace: idempotent namespace creation, safe to re-run
          # imagePullPolicy=Never: uses the image already in Minikube's cache
          #   → load it first with: minikube image load <image>:<tag>
          #   → or build inside Minikube: eval $(minikube docker-env) && docker build .
          # service.type=NodePort: Minikube has no cloud LB; NodePort + minikube service
          #   gives browser-accessible URL on the host machine

      # ── Verify rollout ─────────────────────────────────────────────────────
      - name: Verify Kubernetes rollout
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          echo "── Deployment rollout status ────────────────────────────────"
          kubectl rollout status deployment/${{ env.HELM_RELEASE }} \
            --namespace ${{ env.HELM_NAMESPACE }} \
            --timeout=90s

          echo ""
          echo "── Pods ─────────────────────────────────────────────────────"
          kubectl get pods \
            -l app.kubernetes.io/name=${{ env.HELM_RELEASE }} \
            --namespace ${{ env.HELM_NAMESPACE }} \
            -o wide

          echo ""
          echo "── Services ─────────────────────────────────────────────────"
          kubectl get svc \
            -l app.kubernetes.io/name=${{ env.HELM_RELEASE }} \
            --namespace ${{ env.HELM_NAMESPACE }}

          echo ""
          echo "── Helm release history ─────────────────────────────────────"
          helm history ${{ env.HELM_RELEASE }} \
            --namespace ${{ env.HELM_NAMESPACE }}

      # ── Local smoke test via NodePort ──────────────────────────────────────
      - name: Smoke test — NodePort health check
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          echo "── Discovering NodePort ─────────────────────────────────────"

          NODE_PORT=$(kubectl get svc ${{ env.HELM_RELEASE }} \
            --namespace ${{ env.HELM_NAMESPACE }} \
            -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null)

          MINIKUBE_IP=$(minikube ip 2>/dev/null \
            || kubectl get node minikube \
               -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}' 2>/dev/null \
            || echo "")

          if [ -z "${MINIKUBE_IP}" ] || [ -z "${NODE_PORT}" ]; then
            echo "⚠️  Could not resolve Minikube IP or NodePort — skipping HTTP smoke test"
            echo "   NodePort : ${NODE_PORT:-<not found>}"
            echo "   Minikube IP: ${MINIKUBE_IP:-<not found>}"
            echo ""
            echo "   Run this manually on your Windows host:"
            echo "   minikube service ${{ env.HELM_RELEASE }} --namespace ${{ env.HELM_NAMESPACE }}"
            exit 0
          fi

          APP_URL="http://${MINIKUBE_IP}:${NODE_PORT}"
          echo "Testing: ${APP_URL}/health"
          echo ""

          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 5 \
              "${APP_URL}/health" 2>/dev/null || echo "000")

            if [ "${STATUS}" = "200" ]; then
              echo "✅ Smoke test passed — HTTP 200 from /health"
              break
            elif [ "${STATUS}" = "000" ]; then
              echo "⏳ Attempt ${i}/5 — connection refused, retrying in 10s..."
            else
              echo "⏳ Attempt ${i}/5 — HTTP ${STATUS}, retrying in 10s..."
            fi

            [ $i -eq 5 ] && {
              echo ""
              echo "⚠️  Smoke test did not get HTTP 200 after 5 attempts"
              echo "   The app may still be starting — test manually:"
              echo "   curl http://${MINIKUBE_IP}:${NODE_PORT}/health"
              echo ""
              echo "   Or open in browser via:"
              echo "   minikube service ${{ env.HELM_RELEASE }} --namespace ${{ env.HELM_NAMESPACE }}"
            }
            sleep 10
          done

      # ── Print access instructions ──────────────────────────────────────────
      - name: Print access instructions
        if: always()
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          NODE_PORT=$(kubectl get svc ${{ env.HELM_RELEASE }} \
            --namespace ${{ env.HELM_NAMESPACE }} \
            -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || echo "")
          MINIKUBE_IP=$(minikube ip 2>/dev/null || echo "<run: minikube ip>")

          echo ""
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║  ✅  Helm deploy complete — access your app                   ║"
          echo "╠═══════════════════════════════════════════════════════════════╣"
          echo "║                                                               ║"
          echo "║  Option A — auto-open in browser (recommended on Windows):    ║"
          printf "║    %-61s ║\n" "minikube service ${{ env.HELM_RELEASE }} -n ${{ env.HELM_NAMESPACE }}"
          echo "║                                                               ║"
          echo "║  Option B — kubectl port-forward (works inside act container):║"
          printf "║    %-61s ║\n" "kubectl port-forward svc/${{ env.HELM_RELEASE }} 8080:80 -n ${{ env.HELM_NAMESPACE }}"
          printf "║    %-61s ║\n" "Then: http://localhost:8080"
          echo "║                                                               ║"
          if [ -n "${NODE_PORT}" ]; then
          echo "║  Option C — direct NodePort URL:                              ║"
          printf "║    %-61s ║\n" "http://${MINIKUBE_IP}:${NODE_PORT}"
          fi
          echo "║                                                               ║"
          echo "╠═══════════════════════════════════════════════════════════════╣"
          echo "║  Useful commands:                                             ║"
          printf "║    %-61s ║\n" "kubectl logs -l app=${{ env.HELM_RELEASE }} -n ${{ env.HELM_NAMESPACE }} -f"
          printf "║    %-61s ║\n" "helm status ${{ env.HELM_RELEASE }} -n ${{ env.HELM_NAMESPACE }}"
          printf "║    %-61s ║\n" "helm rollback ${{ env.HELM_RELEASE }} -n ${{ env.HELM_NAMESPACE }}"
          echo "╚═══════════════════════════════════════════════════════════════╝"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4 — TEARDOWN (only when helm_action=uninstall or terraform_action=destroy)
  # Removes the Helm release then destroys Terraform-managed resources.
  # Runs independently of the deploy jobs.
  # ───────────────────────────────────────────────────────────────────────────
  teardown:
    name: "🗑️  Teardown — Helm uninstall + Terraform destroy"
    runs-on: ubuntu-latest
    needs: [preflight]
    if: |
      github.event.inputs.helm_action == 'uninstall' ||
      github.event.inputs.terraform_action == 'destroy'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Terraform ${{ env.TERRAFORM_VERSION }}
        run: |
          TF_VERSION="${{ env.TERRAFORM_VERSION }}"
          curl -fsSL \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" \
            -o /tmp/terraform.zip
          unzip -q /tmp/terraform.zip -d /tmp/tf_bin
          sudo install -m 755 /tmp/tf_bin/terraform /usr/local/bin/terraform
          terraform version

      - name: Helm uninstall
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          echo "── Uninstalling Helm release ────────────────────────────────"
          if helm status ${{ env.HELM_RELEASE }} \
              --namespace ${{ env.HELM_NAMESPACE }} &>/dev/null; then
            helm uninstall ${{ env.HELM_RELEASE }} \
              --namespace ${{ env.HELM_NAMESPACE }} \
              --wait \
              --timeout 2m
            echo "✅ Helm release removed"
          else
            echo "ℹ️  No release found — nothing to uninstall"
          fi

      - name: Terraform Destroy
        if: github.event.inputs.terraform_action == 'destroy'
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          cat > backend_override.tf <<'EOF'
          terraform { backend "local" { path = "local-state/terraform.tfstate" } }
          EOF

          terraform init -reconfigure -no-color
          echo ""
          echo "⚠️  Destroying all Terraform-managed resources in 5 seconds..."
          sleep 5
          terraform destroy \
            -auto-approve \
            -no-color \
            -var="environment=local" \
            -var="kubeconfig_path=${{ env.KUBECONFIG_PATH }}" \
            -var="kubeconfig_context=${{ env.MINIKUBE_CONTEXT }}"
          echo "✅ Terraform destroy complete"
