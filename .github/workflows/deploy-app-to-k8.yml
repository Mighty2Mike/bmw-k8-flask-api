name: CD — Infrastructure → Deploy
on:
  pull_request:
    # This workflow triggers when a PR is opened against any of these branches
    branches:
      - master
      - develop
      - test
      - int
      - prod
      - 'releases/**'
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# CONCURRENCY — cancel in-flight runs on the same ref to save runner minutes
# Production deploys are NOT cancelled mid-flight (separate group)
# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ─────────────────────────────────────────────────────────────────────────────
# GLOBAL ENVIRONMENT — single source of truth, override per job as needed
# ─────────────────────────────────────────────────────────────────────────────
env:
  DOCKER_IMAGE: michaelnthodidocker/bmw-flask-k8-assessment
  DOCKER_TAG: ${{ github.sha }}          # Immutable tag — never use :latest as sole tag
  DOCKER_TAG_LATEST: latest
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.8.0"
  HELM_RELEASE: bmw-k8-flask-api
  HELM_CHART_PATH: ./charts/bmw-k8-flask-api
  TERRAFORM_DIR: terraform

jobs:
  # ===========================================================================
  # JOB 1: TERRAFORM & Helm chart — Infrastructure as Code
  # Runs AFTER image is pushed so infra can reference the new image if needed
  # ===========================================================================
  deploy-infra-and-helm-chart:
    runs-on: ubuntu-latest
    name: "🏗️ Infra & Helm Chart Deployment on K8 cluster"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: medyagh/local-dev-example-with-minikube
      - name: Start minikube
        uses: medyagh/setup-minikube@latest
      # now you can run kubectl to see the pods in the cluster
      - name: Try the cluster!
        run: kubectl get pods -A

      - name: Install K8 addons
        run: |
           #Required for HPA
           minikube addons enable metrics-server 
           #Required for NGINX ingress  
           minikube addons enable ingress   
           
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Checkout source FLASK API repo
        uses: actions/checkout@v4

      - name: Install teraform
        uses: hashicorp/setup-terraform@v4

      - name: Deploy K8 VPA Helm Chart
        run: |
          # Add the repository
          helm repo add fairwinds-stable https://charts.fairwinds.com/stable
          helm repo update
          
          # Install or upgrade the chart
          helm install my-vpa fairwinds-stable/vpa --version 1.3.1
          kubectl delete -A ValidatingWebhookConfiguration ingress-nginx-admission
 
      - name: Terraform Init
        run: |
          cd ${{ env.TERRAFORM_DIR }}
          terraform init

      - name: Terraform Validate
        run: |
          cd ${{ env.TERRAFORM_DIR }}
          terraform validate -no-color
 
      - name: Terraform Format Check
        run: |
          cd ${{ env.TERRAFORM_DIR }}
          terraform fmt -check -recursive -no-color || {
            echo "⚠️  Auto-fixing format..."
            terraform fmt -recursive
          }
 
      - name: Terraform Plan
        run: |
          cd ${{ env.TERRAFORM_DIR }}
          terraform plan \
            -no-color \
            -out=tfplan \
            -detailed-exitcode \
            2>&1 | tee plan-output.txt
 
          EXIT=${PIPESTATUS[0]}
          [ $EXIT -eq 0 ] && echo "✅ No changes" && exit 0
          [ $EXIT -eq 2 ] && echo "📋 Changes detected" && exit 0
          exit $EXIT

      - name: Terraform Apply
        run: |
          cd ${{ env.TERRAFORM_DIR }}
          terraform apply -auto-approve -no-color -var='enable_feature=false'
          echo ""
          echo "── Resources in state ──────────────────────────────────"
          terraform state list 2>/dev/null || true
          echo ""
          echo "── Outputs ─────────────────────────────────────────────"
          terraform output -no-color 2>/dev/null || echo "(no outputs defined)"

      - name: Deploy BMW FLASK API Helm Chart
        run: |
          helm install ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART_PATH }} -n ${{ env.HELM_RELEASE }}
          
      - name: Wait for 60 seconds
        run: sleep 60s

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/${{ env.HELM_RELEASE }} \
            --namespace ${{ env.HELM_RELEASE }} \
            --timeout=120s

          echo "── Pod status ──────────────────────────────────"
          kubectl get pods -l app.kubernetes.io/name=${{ env.HELM_RELEASE }} \
            --namespace ${{ env.HELM_RELEASE }}

          echo "── Service endpoints ────────────────────────────"
          kubectl get svc ${{ env.HELM_RELEASE }} --namespace ${{ env.HELM_RELEASE }}

          echo "── Deployments ────────────────────────────"
          kubectl get deployment ${{ env.HELM_RELEASE }} --namespace ${{ env.HELM_RELEASE }}


      - name: Smoke test — health check
        run: |
          APP_URL=$(minikube service ${{ env.HELM_RELEASE }} -n ${{ env.HELM_RELEASE }} --url)
          echo "Running smoke test against ${APP_URL}"

          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${APP_URL}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Smoke test passed — HTTP 200 from /health"
              exit 0
            fi
            echo "⏳ Attempt $i/5 — got HTTP ${STATUS}, retrying in 15s..."
            sleep 15
          done

          echo "❌ Smoke test failed after 5 attempts"
          echo "⚠️  Triggering Helm rollback..."
          helm rollback ${{ env.HELM_RELEASE }} --namespace ${{ env.HELM_RELEASE }}
          exit 1

      # ── Helm release summary ──────────────────────────────────────────────
      - name: Print Helm release summary
        if: always()
        run: |
          helm history ${{ env.HELM_RELEASE }} --namespace ${{ env.HELM_RELEASE }}


      - name: Test service URLs
        run: |
          minikube service list
          minikube service ${{ env.HELM_RELEASE }} -n ${{ env.HELM_RELEASE }} --url
          echo -n "------------------opening the service------------------"
          curl $(minikube service ${{ env.HELM_RELEASE }} -n ${{ env.HELM_RELEASE }} --url)
          echo -n "------------------opening the /api/v1/data route ------------------"
          curl $(minikube service ${{ env.HELM_RELEASE }} -n ${{ env.HELM_RELEASE }} --url)/api/v1/data

  
  # ===========================================================================
  # JOB 2: NOTIFY — Pipeline outcome notification
  # ===========================================================================
  notify:
    name: "📣 Notify Pipeline Result"
    runs-on: ubuntu-latest
    needs: [deploy-infra-and-helm-chart]
    if: always()   # Run even if upstream jobs fail

    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.sast.result }}" == "failure" ]]; then
            echo "status=❌ SAST gate failed — pipeline blocked" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.build-and-push.result }}" == "failure" ]]; then
            echo "status=❌ Docker build/push failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.deploy-infra-and-helm-chart.result }}" == "failure" ]]; then
            echo "status=❌ Terraform apply & Helm deploy failed" >> $GITHUB_OUTPUT
            echo "color=warning" >> $GITHUB_OUTPUT
          else
            echo "status=✅ Full pipeline succeeded" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        run: |
          # TODO - SEND Notifications to Teams channel of failures (if any)