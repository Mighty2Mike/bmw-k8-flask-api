name: CI
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
jobs:
  job1:
    runs-on: ubuntu-latest
    name: build discover and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          repository: medyagh/local-dev-example-with-minikube
      - name: Start minikube
        uses: medyagh/setup-minikube@latest
      # now you can run kubectl to see the pods in the cluster
      - name: Try the cluster!
        run: kubectl get pods -A

      - name: Install K8 addons
        run: |
           #Required for HPA
           minikube addons enable metrics-server 
           #Required for NGINX ingress  
           minikube addons enable ingress   
           
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Checkout source FLASK API repo
        uses: actions/checkout@v4

      - name: Install teraform
        uses: hashicorp/setup-terraform@v4

      - name: Deploy K8 VPA Helm Chart
        run: |
          # Add the repository
          helm repo add fairwinds-stable https://charts.fairwinds.com/stable
          helm repo update
          
          # Install or upgrade the chart
          helm install my-vpa fairwinds-stable/vpa --version 1.3.1
          kubectl delete -A ValidatingWebhookConfiguration ingress-nginx-admission
 
      - name: Terraform Validate
        run: terraform validate -no-color
 
      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive -no-color || {
            echo "⚠️  Auto-fixing format..."
            terraform fmt -recursive
          }
 
      - name: Terraform Plan
        run: |
          cd terraform
          terraform init
          terraform plan \
            -no-color \
            -out=tfplan \
            -detailed-exitcode \
            2>&1 | tee plan-output.txt
 
          EXIT=${PIPESTATUS[0]}
          [ $EXIT -eq 0 ] && echo "✅ No changes" && exit 0
          [ $EXIT -eq 2 ] && echo "📋 Changes detected" && exit 0
          exit $EXIT

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve -no-color -input=false tfplan -var='enable_feature=false'
          echo ""
          echo "── Resources in state ──────────────────────────────────"
          terraform state list 2>/dev/null || true
          echo ""
          echo "── Outputs ─────────────────────────────────────────────"
          terraform output -no-color 2>/dev/null || echo "(no outputs defined)"

      - name: Deploy BMW FLASK API Helm Chart
        run: |
          helm upgrade --install bmw-k8-flask-api ./charts/bmw-k8-flask-api -n bmw-k8-flask-api
